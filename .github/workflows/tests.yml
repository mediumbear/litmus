name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.17
        run: scripts/get-zig.sh
      - name: Unit tests, and the book against src/
        run: tools/zig/zig build test
      - name: Golden tests
        run: tools/zig/zig build cases
      - name: The book tangles to Litmus, which tangles the book
        run: tools/zig/zig build self
